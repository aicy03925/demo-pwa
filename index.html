/* ─── 工時計算工具函數（含午休扣除） ─── */
function getCalculatedHoursText(startH, startM, endH, endM) {
  if (!startH || !startM || !endH || !endM) return "—";
  let start = parseInt(startH, 10) * 60 + parseInt(startM, 10);
  let end   = parseInt(endH, 10)   * 60 + parseInt(endM, 10);
  if (end < start) end += 24 * 60;
  let totalMinutes = end - start;
  const restStart = 12 * 60;
  const restEnd   = 13 * 60;
  let overlap = 0;
  let overlapStart1 = Math.max(start, restStart);
  let overlapEnd1   = Math.min(end, restEnd);
  if (overlapStart1 < overlapEnd1) overlap += (overlapEnd1 - overlapStart1);
  let overlapStart2 = Math.max(start, restStart + 24 * 60);
  let overlapEnd2   = Math.min(end, restEnd + 24 * 60);
  if (overlapStart2 < overlapEnd2) overlap += (overlapEnd2 - overlapStart2);
  let actualMinutes = totalMinutes - overlap;
  if (actualMinutes < 0) actualMinutes = 0;
  const hrs  = Math.floor(actualMinutes / 60);
  const mins = actualMinutes % 60;
  return mins > 0 ? `${hrs} 小時 ${mins} 分` : `${hrs} 小時`;
}

/* ─── 評分小工具（燈具光學/品質評估用） ─── */
function scoreOf(value) {
  const m = /\((\d+)\)/.exec(value || "");
  return m ? parseInt(m[1], 10) : 0;
}
function sumScore(arr) {
  return (arr || []).reduce((s, r) => s + scoreOf(r && r.value), 0);
}
function gradeLabel(score, ranges) {
  for (const r of ranges) if (score >= r.min && score <= r.max) return r.grade;
  return "—";
}
const OPTICAL_RANGES = [{ min:26, max:30, grade:"A合格" }, { min:20, max:25, grade:"B尚可" }, { min:10, max:19, grade:"C不合格" }];
const QUALITY_RANGES = [{ min:33, max:36, grade:"A合格" }, { min:24, max:32, grade:"B尚可" }, { min:12, max:23, grade:"C不合格" }];

/* ─── Reusable form widgets ─── */
const S = {
  label: { display:"block", fontSize:12, fontWeight:700, color:"#6B7280", marginBottom:5, textTransform:"uppercase", letterSpacing:0.5 },
  input: { width:"100%", padding:"11px 13px", fontSize:15, borderRadius:9, border:"1.5px solid #D1D5DB", background:"#fff", outline:"none", fontFamily:"inherit" },
  card:  { background:"#fff", borderRadius:14, padding:"20px 16px", boxShadow:"0 2px 12px rgba(0,0,0,0.07)", marginBottom:16 },
};

function Sel({ label, value, onChange, options, placeholder }) {
  return e("div", { style: { marginBottom: 15 } },
    e("label", { style: S.label }, label),
    e("div", { style: { position: "relative" } },
      e("select", {
        value: value,
        onChange: ev => onChange(ev.target.value),
        style: { ...S.input, paddingRight: 36, appearance: "none", WebkitAppearance: "none", cursor: "pointer", color: value ? "#1F2937" : "#9CA3AF" }
      },
        e("option", { value: "" }, placeholder || "請選擇..."),
        options.map(o => e("option", { key: o, value: o }, o))
      ),
      e("span", { style: { position: "absolute", right: 12, top: "50%", transform: "translateY(-50%)", color: "#9CA3AF", pointerEvents: "none", fontSize: 11 } }, "▼")
    )
  );
}

function Txt({ label, value, onChange, placeholder, multi }) {
  return e("div", { style: { marginBottom: 15 } },
    e("label", { style: S.label }, label),
    multi
      ? e("textarea", {
          value: value,
          onChange: ev => onChange(ev.target.value),
          placeholder: placeholder || "",
          rows: 3,
          style: { ...S.input, resize: "vertical", lineHeight: 1.7 }
        })
      : e("input", {
          value: value,
          onChange: ev => onChange(ev.target.value),
          placeholder: placeholder || "",
          style: S.input
        })
  );
}

function SectionTitle({ children }) {
  return e("div", { style: { fontWeight:800, fontSize:13, color:"#374151", background:"#F3F4F6", padding:"9px 12px", borderRadius:8, margin:"20px 0 12px", letterSpacing:0.5 } }, children);
}

function pillStyle(active, color) {
  const c = color || "#F97316";
  return {
    padding:"7px 12px", borderRadius:8, fontSize:12, fontWeight:700, cursor:"pointer",
    border:`1.5px solid ${active ? c : "#E5E7EB"}`,
    background: active ? `${c}1A` : "#fff",
    color: active ? c : "#374151"
  };
}

/* ─── 升級版：真實相機/拍照上傳元件 ─── */
function PhotoUpload({ label, src, onImageChange }) {
  const fileInputRef = useRef(null);

  const handleFileChange = (ev) => {
    const file = ev.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onloadend = () => {
        onImageChange(reader.result);
      };
      reader.readAsDataURL(file);
    }
  };

  return e("div", { style: { flex: 1, minWidth: "120px" } },
    e("span", { style: { ...S.label, fontSize: 11, textAlign: "center", marginBottom: 4 } }, label),
    e("input", {
      type: "file",
      accept: "image/*",
      ref: fileInputRef,
      onChange: handleFileChange,
      style: { display: "none" }
    }),
    src
      ? e("div", { style: { position: "relative", borderRadius: 8, overflow: "hidden", border: "2px solid #6EE7B7" } },
          e("img", { src: src, style: { width: "100%", height: 100, objectFit: "cover", display: "block" } }),
          e("button", {
            onClick: (ev) => { ev.preventDefault(); onImageChange(null); },
            style: { position: "absolute", top: 4, right: 4, background: "rgba(239,68,68,0.85)", border: "none", borderRadius: "50%", width: 20, height: 20, color: "#fff", fontSize: 10, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }
          }, "✕")
        )
      : e("button", {
          type: "button",
          onClick: () => fileInputRef.current.click(),
          style: { width: "100%", height: 100, border: "1.5px dashed #CBD5E0", borderRadius: 8, background: "#F9FAFB", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 4, cursor: "pointer" }
        },
          e("span", { style: { fontSize: 20 } }, "📷"),
          e("span", { style: { fontSize: 11, fontWeight: 600, color: "#9CA3AF" } }, "拍照 / 上傳")
        )
  );
}

/* Photo：MeetingForm / InstallForm 使用的單張照片包裝元件 */
function Photo({ label, photo, onCapture }) {
  return e(PhotoUpload, { label, src: photo, onImageChange: onCapture });
}

/* ─── 動態項目明細表格（報價/請款/訂貨等表單共用） ─── */
function ItemsTable({ label, columns, rows, onChange, aggregate }) {
  const addRow = () => onChange([...(rows || []), Object.fromEntries(columns.map(c => [c.key, ""]))]);
  const removeRow = (idx) => { if ((rows || []).length <= 1) return; onChange(rows.filter((_, i) => i !== idx)); };
  const updateCell = (idx, key, val) => {
    const nr = [...rows];
    nr[idx] = { ...nr[idx], [key]: val };
    onChange(nr);
  };

  let aggValue = null;
  if (aggregate) {
    const nums = (rows || []).map(r => parseFloat(r[aggregate.key])).filter(n => !isNaN(n));
    if (aggregate.type === "sum") aggValue = nums.reduce((a, b) => a + b, 0);
    else aggValue = nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : 0;
  }

  return e("div", { style: { marginBottom: 16 } },
    e("div", { style: { ...S.label, marginBottom: 8 } }, label || "項目明細"),
    (rows || []).map((row, idx) => e("div", { key: idx, style: { background: "#F9FAFB", border: "1px solid #E5E7EB", borderRadius: 10, padding: 12, marginBottom: 10 } },
      e("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 } },
        e("span", { style: { fontSize: 12, fontWeight: 700, color: "#6B7280" } }, `項目 #${idx + 1}`),
        (rows.length > 1) && e("button", { type: "button", onClick: () => removeRow(idx), style: { background: "none", border: "none", color: "#EF4444", fontSize: 11, fontWeight: 600, cursor: "pointer" } }, "🛑 刪除")
      ),
      e("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 } },
        columns.map(c => e("div", { key: c.key },
          e("label", { style: { fontSize: 10, color: "#9CA3AF", fontWeight: 700 } }, c.label),
          e("input", {
            value: row[c.key] || "",
            onChange: ev => updateCell(idx, c.key, ev.target.value),
            style: { ...S.input, padding: "7px 9px", fontSize: 13, marginTop: 2 }
          })
        ))
      )
    )),
    e("button", {
      type: "button", onClick: addRow,
      style: { width: "100%", padding: "9px", fontSize: 13, fontWeight: 700, borderRadius: 8, border: "1.5px dashed #9CA3AF", background: "#F9FAFB", color: "#6B7280", cursor: "pointer" }
    }, "＋ 新增一筆項目"),
    aggregate && e("div", { style: { marginTop: 8, padding: "9px 12px", background: "#FFF7ED", border: "1px solid #FED7AA", borderRadius: 8, display: "flex", justifyContent: "space-between", fontSize: 13 } },
      e("span", { style: { color: "#C2410C", fontWeight: 700 } }, aggregate.label),
      e("span", { style: { color: "#9A3412", fontWeight: 800 } }, (aggValue || 0).toFixed(1))
    )
  );
}

/* ─── 評核清單元件（訂製品檢測表 / 照明設備檢測紀錄表共用） ─── */
function RatingChecklist({ items, defaultOptions, data, onChange }) {
  return e("div", null,
    items.map((item, idx) => {
      const text = typeof item === "string" ? item : item.text;
      const opts = (typeof item === "object" && item.opts) ? item.opts : defaultOptions;
      const rowData = (data && data[idx]) || { value: "", note: "" };
      return e("div", { key: idx, style: { marginBottom: 12, padding: "12px 13px", background: "#F9FAFB", border: "1px solid #E5E7EB", borderRadius: 10 } },
        e("div", { style: { fontSize: 13, fontWeight: 600, color: "#374151", marginBottom: 9, lineHeight: 1.6 } }, `${idx + 1}. ${text}`),
        e("div", { style: { display: "flex", gap: 8, marginBottom: 8, flexWrap: "wrap" } },
          opts.map(opt => e("button", {
            key: opt, type: "button",
            onClick: () => onChange(idx, "value", opt),
            style: pillStyle(rowData.value === opt)
          }, opt))
        ),
        e("input", {
          value: rowData.note, onChange: ev => onChange(idx, "note", ev.target.value),
          placeholder: "備註（選填）...",
          style: { ...S.input, fontSize: 13, padding: "8px 10px" }
        })
      );
    })
  );
}

/* ─── 三個既有工程部表單（保留原樣） ─── */
function SurveyForm({ data, setData, caseData }) {
  const set = (k, v) => setData(p => ({ ...p, [k]: v }));

  const projectNames = [...caseData.案件列表.map(c => c.案件名稱), ...CUSTOM_TRIGGER_PROJECTS, "自行填入(手動輸入)"];
  const isCustomTrigger = data.project === "自行填入(手動輸入)" || CUSTOM_TRIGGER_PROJECTS.includes(data.project);

  const findCase = projectName => caseData.案件列表.find(c => c.案件名稱 === projectName);

  const getLocationNames = projectName => {
    if (CUSTOM_TRIGGER_PROJECTS.includes(projectName) || projectName === "自行填入(手動輸入)") return [];
    const c = findCase(projectName);
    return c ? c.樓層區域清單.map(l => l.樓層區域名稱) : [];
  };

  const getEquipmentTypes = (projectName, locationName) => {
    if (CUSTOM_TRIGGER_PROJECTS.includes(projectName) || projectName === "自行填入(手動輸入)") return [];
    const c = findCase(projectName);
    const loc = c && c.樓層區域清單.find(l => l.樓層區域名稱 === locationName);
    return loc ? loc.設備類型清單 : [];
  };

  const calculateDuration = () => {
    return getCalculatedHoursText(data.timeStartH, data.timeStartM, data.timeEndH, data.timeEndM);
  };

  const updateItem = (index, k, v) => {
    const newItems = [...data.items];
    newItems[index] = { ...newItems[index], [k]: v };
    set("items", newItems);
  };

  const updateItemPhoto = (itemIdx, photoIdx, base64Str) => {
    const newItems = [...data.items];
    const newPhotos = [...newItems[itemIdx].photos];
    newPhotos[photoIdx] = base64Str;
    newItems[itemIdx].photos = newPhotos;
    set("items", newItems);
  };

  const addItem = () => {
    set("items", [...data.items, { photos: [null, null], location: "", lightModel: "", execType: "", customExec: "" }]);
  };

  const removeItem = (index) => {
    if (data.items.length <= 1) return;
    const newItems = data.items.filter((_, i) => i !== index);
    set("items", newItems);
  };

  return e(F, null,
    e(Sel, {
      label: "工程案名",
      value: data.project,
      onChange: v => {
        const isTrigger = v === "自行填入(手動輸入)" || CUSTOM_TRIGGER_PROJECTS.includes(v);
        setData(p => ({
          ...p,
          project: v,
          customProject: v === "自行填入(手動輸入)" ? "" : undefined,
          contact: isTrigger ? "" : (findCase(v) || {}).現場聯絡人 || "",
          items: [{ photos: [null, null], location: "", lightModel: "", execType: "", customExec: "" }]
        }));
      },
      options: projectNames
    }),

    data.project === "自行填入(手動輸入)" && e(Txt, {
      label: "請輸入自訂工程案名",
      value: data.customProject || "",
      onChange: v => set("customProject", v),
      placeholder: "請輸入實際的工程案件名稱"
    }),

    isCustomTrigger
      ? e(Txt, { label: "現場聯絡人 (手動輸入)", value: data.contact, onChange: v => set("contact", v), placeholder: "請輸入聯絡人姓名" })
      : e("div", { style: { marginBottom: 15, padding: "11px 13px", background: "#F3F4F6", borderRadius: 9, border: "1.5px solid #E5E7EB" } },
          e("span", { style: { ...S.label, display: "inline" } }, "現場聯絡人 "),
          e("span", { style: { fontSize: 16, fontWeight: 700, color: "#1F2937" } }, data.contact || "—")
        ),

    e(Sel, { label: "作業階段", value: data.progress, onChange: v => set("progress", v), options: PROGRESS }),
    e(Sel, { label: "施工人員", value: data.staff,    onChange: v => set("staff", v),    options: STAFF }),

    e("div", { style: { marginBottom: 15 } },
      e("div", { style: { display: "flex", gap: 12, alignItems: "flex-end" } },
        e("div", { style: { flex: 2 } },
          e("label", { style: S.label }, "施工時間"),
          e("div", { style: { display: "flex", gap: 4, alignItems: "center" } },
            e("select", { value: data.timeStartH, onChange: ev => set("timeStartH", ev.target.value), style: { flex: 1, padding: "10px 4px", fontSize: 13, borderRadius: 8, border: "1.5px solid #D1D5DB", textAlign: "center" } },
              e("option", { value: "" }, "時"), HOURS.map(v => e("option", { key: v, value: v }, v))
            ),
            e("select", { value: data.timeStartM, onChange: ev => set("timeStartM", ev.target.value), style: { flex: 1, padding: "10px 4px", fontSize: 13, borderRadius: 8, border: "1.5px solid #D1D5DB", textAlign: "center" } },
              e("option", { value: "" }, "分"), MINS.map(v => e("option", { key: v, value: v }, v))
            ),
            e("span", { style: { color: "#9CA3AF", padding: "0 2px" } }, "—"),
            e("select", { value: data.timeEndH, onChange: ev => set("timeEndH", ev.target.value), style: { flex: 1, padding: "10px 4px", fontSize: 13, borderRadius: 8, border: "1.5px solid #D1D5DB", textAlign: "center" } },
              e("option", { value: "" }, "時"), HOURS.map(v => e("option", { key: v, value: v }, v))
            ),
            e("select", { value: data.timeEndM, onChange: ev => set("timeEndM", ev.target.value), style: { flex: 1, padding: "10px 4px", fontSize: 13, borderRadius: 8, border: "1.5px solid #D1D5DB", textAlign: "center" } },
              e("option", { value: "" }, "分"), MINS.map(v => e("option", { key: v, value: v }, v))
            )
          )
        ),
        e("div", { style: { flex: 1, padding: "11px 8px", background: "#FFF7ED", borderRadius: 8, border: "1.5px solid #FED7AA", textAlign: "center", height: 43 } },
          e("div", { style: { fontSize: 10, color: "#C2410C", fontWeight: 700, marginBottom: 2 } }, "自動計算總工時"),
          e("div", { style: { fontSize: 13, fontWeight: 700, color: "#9A3412" } }, calculateDuration())
        )
      )
    ),

    e(Txt, { label: "摘要", value: data.summary, onChange: v => set("summary", v), placeholder: "請輸入此回報檔案的摘要說明...", multi: true }),

    e("div", { style: { margin: "20px 0 10px 0", borderBottom: "2px dashed #E5E7EB" } }),

    data.items.map((item, idx) => (
      e("div", { key: idx, style: { background: "#F9FAFB", border: "1px solid #E5E7EB", padding: 14, borderRadius: 12, marginBottom: 16, position: "relative" } },
        e("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 } },
          e("span", { style: { fontSize: 13, fontWeight: 800, color: "#F97316" } }, `📍 記錄群組 #${idx + 1}`),
          data.items.length > 1 && e("button", {
            onClick: () => removeItem(idx),
            style: { background: "none", border: "none", color: "#EF4444", fontSize: 12, fontWeight: 600, cursor: "pointer" }

function defaultGenericData(config) {
  const d = {};
  (config.fields || []).forEach(f => d[f.key] = "");
  (config.fieldsAfter || []).forEach(f => d[f.key] = "");
  if (config.items) d.items = [Object.fromEntries(config.items.columns.map(c => [c.key, ""]))];
  d.note = "";
  if (config.hasPhoto) d.photo = null;
  return d;
}
function defaultDataFor(card) {
  if (!card) return {};
  switch (card.formKind) {
    case "survey": return { project:"", contact:"", progress:"", staff:"", timeStartH:"", timeStartM:"", timeEndH:"", timeEndM:"", summary:"", items:[{ photos:[null,null], location:"", lightModel:"", execType:"", customExec:"" }] };
    case "meeting": return { meetingType:"", topic:"", attendees:"", resolution:"", photo:null };
    case "design_meeting": return { meetingDate:"", meetingStartH:"", meetingStartM:"", meetingEndH:"", meetingEndM:"", location:"", attendees:"", recorder:"", projectName:"", progress:"", topic:"", content:"", postActions:"" };
    case "install": return { zone:"", material:"", inspector:"", checkResult:"", note:"", photo:null };
    case "customInspect": return customInspectDefault();
    case "lightInspect": return lightInspectDefault();
    case "generic": return defaultGenericData(card.config || {});
    default: return {};
  }
}

/* ─── 表單分派渲染 ─── */
function renderFormBody(card, data, setData, caseData) {
  switch (card.formKind) {
    case "survey":  return e(SurveyForm,  { data, setData, caseData });
    case "meeting": return e(MeetingForm, { data, setData });
    case "design_meeting": return e(DesignMeetingForm, { data, setData });
    case "install": return e(InstallForm, { data, setData });
    case "customInspect": return e(CustomInspectForm, { data, setData });
    case "lightInspect":  return e(LightInspectForm,  { data, setData });
    case "generic": return e(GenericForm, { config: card.config, data, setData });
    default: return null;
  }
}

/* ─── 表單填寫摘要（下載前預覽用） ─── */
function getSummaryRows(card, d) {
  const filled = arr => (arr || []).filter(x => x && x.value).length;
  switch (card.formKind) {
    case "survey": return [
      ["工程案名", d.customProject || d.project || "—"],
      ["現場聯絡人", d.contact || "—"],
      ["作業階段", d.progress || "—"],
      ["施工人員", d.staff || "—"],
      ["施工時間", d.timeStartH ? `${d.timeStartH}:${d.timeStartM || "00"} ～ ${d.timeEndH || "__"}:${d.timeEndM || "00"}` : "—"],
      ["工作摘要", d.summary || "—"],
      ["記錄組數", `已建立 ${d.items ? d.items.length : 0} 組施工位置與照片`]
    ];
    case "meeting": return [
      ["會議類型", d.meetingType || "—"], ["會議主題", d.topic || "—"], ["與會人員", d.attendees || "—"], ["決議追蹤", d.resolution || "—"]
    ];
    case "design_meeting": return [
      ["會議時間", `${d.meetingDate || "—"}${(d.meetingStartH || d.meetingEndH) ? `　${d.meetingStartH || "--"}:${d.meetingStartM || "00"} ～ ${d.meetingEndH || "--"}:${d.meetingEndM || "00"}` : ""}`],
      ["會議地點", d.location || "—"],
      ["與會人員", d.attendees || "—"],
      ["記錄人員", d.recorder || "—"],
      ["項目名稱", d.projectName || "—"],
      ["項目進程", d.progress || "—"],
      ["會議主旨", d.topic || "—"],
      ["會議內容", d.content || "—"],
      ["會議後執行內容", d.postActions || "—"]
    ];
    case "install": return [
      ["施工區域", d.zone || "—"], ["材料批號", d.material || "—"], ["檢查人員", d.inspector || "—"], ["檢查結果", d.checkResult || "—"], ["備註", d.note || "—"]
    ];
    case "customInspect": return [
      ["案名", d.caseName || "—"], ["燈具符號", d.lightSymbol || "—"], ["安裝位置", d.location || "—"], ["測試目的", d.testPurpose || "—"],
      ["自主檢查表", `已填寫 ${filled(d.selfCheck)} / ${SELF_CHECK_ITEMS.length} 項`],
      ["廠驗評估表", `已填寫 ${filled(d.evalCheck)} / ${EVAL_ITEMS.length} 項`]
    ];
    case "lightInspect": {
      const s1 = sumScore(d.opticalCheck), s2 = sumScore(d.qualityCheck);
      return [
        ["案名", d.caseName || "—"], ["廠牌", d.brand || "—"], ["燈具型號", d.modelNo || "—"], ["W數", d.wattage || "—"],
        ["光學品質評估", `已填寫 ${filled(d.opticalCheck)}/${OPTICAL_ITEMS.length} 項，評分 ${s1}／30，等級 ${gradeLabel(s1, OPTICAL_RANGES)}`],
        ["燈具品質評估", `已填寫 ${filled(d.qualityCheck)}/${QUALITY_ITEMS.length} 項，評分 ${s2}／36，等級 ${gradeLabel(s2, QUALITY_RANGES)}`]
      ];
    }
    case "generic": {
      const cfg = card.config;
      const rows = (cfg.fields || []).map(f => [f.label, d[f.key] || "—"]);
      if (cfg.items) {
        rows.push([cfg.items.label || "項目筆數", `共 ${(d.items || []).length} 筆`]);
        if (cfg.items.aggregate) {
          const nums = (d.items || []).map(r => parseFloat(r[cfg.items.aggregate.key])).filter(n => !isNaN(n));
          const agg = cfg.items.aggregate.type === "sum" ? nums.reduce((a, b) => a + b, 0) : (nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : 0);
          rows.push([cfg.items.aggregate.label, agg.toFixed(1)]);
        }
      }
      rows.push([cfg.notesLabel || "備註", d.note || "—"]);
      return rows;
    }
    default: return [];
  }
}

/* ─── PDF A4 Template ─── */
const PAGE_W = 794, PAGE_H = 1123;
const SIDE_PAD = 40;
const TITLE_ROW_H = 32;
const CONT_PAD = TITLE_ROW_H * 2;
const PHOTO_CELL_H = 400;

function pdfPageShell(inner, first, last) {
  const pad = first ? 36 : CONT_PAD;
  return `<div class="pdf-page" style="width:${PAGE_W}px;height:${PAGE_H}px;box-sizing:border-box;background:#fff;position:relative;overflow:hidden;padding:${pad}px ${SIDE_PAD}px;font-family:Arial,'Microsoft JhengHei','PingFang TC',sans-serif;font-size:12px;line-height:1.5;color:#1F2937;${last ? "" : "page-break-after:always;"}">${inner}</div>`;
}

function buildHeaderHTML(card) {
  const dept = DEPARTMENTS.find(x => x.id === card.dept);
  return `
    <div style="text-align:center;padding-bottom:10px;border-bottom:3px solid #1F2937;margin-bottom:8px">
      <div style="font-size:9px;color:#F97316;font-weight:700;letter-spacing:3px;margin-bottom:4px">REPORTING SYSTEM ｜ ${dept ? dept.label : ""}</div>
      <div style="font-size:22px;font-weight:800;color:#1F2937;letter-spacing:3px">表單回報系統 — ${card.label}</div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:10px;color:#6B7280;padding:5px 0 14px;border-bottom:1px solid #9CA3AF;margin-bottom:18px">
      <span>填報日期：${DATE_STR}</span>
      <span>系統版本：v1.0</span>
    </div>`;
}

const secBar = t => `<div style="font-weight:700;font-size:12px;background:#F3F4F6;padding:7px 10px;border:1px solid #CBD5E0;border-bottom:none;letter-spacing:1px">■ ${t}</div>`;

function buildSigHTML(cols) {
  const list = (cols && cols.length) ? cols : SIG_COLS;
  return `
    <div style="font-weight:700;font-size:12px;background:#F3F4F6;padding:7px 10px;border:1px solid #CBD5E0;border-bottom:none;letter-spacing:1px;margin-top:14px">■ 人員簽名確認</div>
    <table style="width:100%;border-collapse:collapse">
      <thead><tr>${list.map(c => `<th style="border:1px solid #CBD5E0;padding:8px;background:#1F2937;color:#fff;font-size:11px;font-weight:700;text-align:center">${c}</th>`).join("")}</tr></thead>
      <tbody><tr>${list.map(() => `<td style="border:1px solid #CBD5E0;height:65px;padding:6px 10px;vertical-align:bottom;font-size:10px;color:#9CA3AF">簽名：___________ 日期：___________</td>`).join("")}</tr></tbody>
    </table>`;
}

function buildFootHTML() {
  return `<div style="position:absolute;left:${SIDE_PAD}px;right:${SIDE_PAD}px;bottom:18px;text-align:center;font-size:10px;color:#9CA3AF;padding-top:12px;border-top:1px solid #E5E7EB">本表單由表單回報系統自動產生 &nbsp;·&nbsp; 填報時間：${new Date().toLocaleString("zh-TW")} &nbsp;·&nbsp; 僅供內部使用，請妥善保管</div>`;
}

function checklistTableHTML(items, data) {
  const tdQ = `style="font-size:12px;color:#1F2937;padding:8px 9px;border:1px solid #CBD5E0;vertical-align:top;width:55%"`;
  const tdR = `style="font-size:12px;color:#1F2937;padding:8px 9px;border:1px solid #CBD5E0;vertical-align:middle;text-align:center;width:15%"`;
  const tdN = `style="font-size:11px;color:#374151;padding:8px 9px;border:1px solid #CBD5E0;vertical-align:top"`;
  const rows = items.map((item, idx) => {
    const rowData = (data && data[idx]) || { value:"", note:"" };
    const text = typeof item === "string" ? item : item.text;
    return `<tr><td ${tdQ}>${idx + 1}. ${text}</td><td ${tdR}>${rowData.value || "—"}</td><td ${tdN}>${rowData.note || ""}</td></tr>`;
  }).join("");
  return `<table style="width:100%;border-collapse:collapse;margin-bottom:14px">
    <thead><tr>
      <th style="border:1px solid #CBD5E0;padding:8px;background:#1F2937;color:#fff;font-size:11px">檢查項目</th>
      <th style="border:1px solid #CBD5E0;padding:8px;background:#1F2937;color:#fff;font-size:11px">結果</th>
      <th style="border:1px solid #CBD5E0;padding:8px;background:#1F2937;color:#fff;font-size:11px">備註</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function photoGridHTML(slots) {
  let rows = "";
  for (let i = 0; i < slots.length; i += 4) {
    const chunk = slots.slice(i, i + 4).map(s => `<td style="border:1px solid #CBD5E0;padding:8px;width:25%;height:140px;text-align:center;vertical-align:middle">${s.src ? `<img src="${s.src}" crossorigin="anonymous" style="max-width:100%;max-height:120px;object-fit:contain">` : ""}<div style="font-size:10px;color:#6B7280;margin-top:4px">${s.label || ""}</div></td>`).join("");
    rows += `<tr>${chunk}</tr>`;
  }
  return `<table style="width:100%;border-collapse:collapse;margin-bottom:14px"><tbody>${rows}</tbody></table>`;
}

function fieldsTableHTML(fields, d) {
  const tdL = `style="font-weight:700;background:#F8F9FA;font-size:11px;color:#374151;width:110px;padding:8px 9px;border:1px solid #CBD5E0;vertical-align:middle"`;
  const tdV = `style="font-size:12px;color:#1F2937;padding:8px 9px;border:1px solid #CBD5E0;vertical-align:middle"`;
  let rowsHtml = "";
  for (let i = 0; i < fields.length; i += 2) {
    const f1 = fields[i], f2 = fields[i + 1];
    rowsHtml += `<tr><td ${tdL}>${f1.label}</td><td ${tdV}${f2 ? "" : ' colspan="3"'}>${(d[f1.key] || "—")}</td>${f2 ? `<td ${tdL}>${f2.label}</td><td ${tdV}>${d[f2.key] || "—"}</td>` : ""}</tr>`;
  }
  return `<table style="width:100%;border-collapse:collapse;margin-bottom:14px"><tbody>${rowsHtml}</tbody></table>`;
}

function itemsTableHTML(itemsConfig, rows) {
  if (!itemsConfig) return "";
  const cols = itemsConfig.columns;
  const head = cols.map(c => `<th style="border:1px solid #CBD5E0;padding:6px;background:#1F2937;color:#fff;font-size:10px">${c.label}</th>`).join("");
  const body = (rows || []).map(r => `<tr>${cols.map(c => `<td style="border:1px solid #CBD5E0;padding:6px;font-size:11px;text-align:center">${r[c.key] || "—"}</td>`).join("")}</tr>`).join("");
  let aggHtml = "";
  if (itemsConfig.aggregate) {
    const nums = (rows || []).map(r => parseFloat(r[itemsConfig.aggregate.key])).filter(n => !isNaN(n));
    const val = itemsConfig.aggregate.type === "sum" ? nums.reduce((a, b) => a + b, 0) : (nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : 0);
    aggHtml = `<div style="text-align:right;font-size:12px;font-weight:700;color:#9A3412;background:#FFF7ED;border:1px solid #FED7AA;padding:8px 10px;margin-top:-1px">${itemsConfig.aggregate.label}：${val.toFixed(1)}</div>`;
  }
  return `<div style="font-weight:700;font-size:12px;background:#F3F4F6;padding:7px 10px;border:1px solid #CBD5E0;border-bottom:none;letter-spacing:1px;margin-top:6px">■ ${itemsConfig.label || "項目明細"}</div>
    <table style="width:100%;border-collapse:collapse;margin-bottom:2px"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>${aggHtml}`;
}

/* ── 工程回報 PDF（原樣） ── */
function buildSurveyPDF(card, d) {
  const tdL  = `style="font-weight:700;background:#F8F9FA;font-size:11px;color:#374151;width:80px;padding:8px 9px;border:1px solid #CBD5E0;vertical-align:middle;white-space:nowrap"`;
  const tdV  = `style="font-size:12px;color:#1F2937;padding:8px 9px;border:1px solid #CBD5E0;vertical-align:middle"`;
  const tdSum = `style="font-size:12px;color:#1F2937;padding:8px 9px;border:1px solid #CBD5E0;vertical-align:middle;white-space:pre-wrap;height:106px"`;

  const durationStr = getCalculatedHoursText(d.timeStartH, d.timeStartM, d.timeEndH, d.timeEndM);
  const timeStr = d.timeStartH
    ? `${d.timeStartH}:${d.timeStartM || "00"} ～ ${d.timeEndH || "__"}:${d.timeEndM || "00"} (總工時：${durationStr})`
    : "—";

  const infoHTML = secBar("工程回報資訊") + `
    <table style="width:100%;border-collapse:collapse;margin-bottom:14px">
      <tbody>
        <tr><td ${tdL}>工程案名</td><td ${tdV}>${d.customProject || d.project || "—"}</td><td ${tdL}>現場聯絡人</td><td ${tdV}>${d.contact || "—"}</td></tr>
        <tr><td ${tdL}>作業階段</td><td ${tdV}>${d.progress || "—"}</td><td ${tdL}>施工人員</td><td ${tdV}>${d.staff || "—"}</td></tr>
        <tr><td ${tdL}>施工時間</td><td ${tdV} colspan="3">${timeStr}</td></tr>
        <tr><td ${tdL}>工作摘要</td><td ${tdSum} colspan="3">${d.summary || "—"}</td></tr>
      </tbody>
    </table>`;

  const groupTableHTML = (item, gapTop) => {
    const execStr = item.execType === EXEC_CUSTOM ? (item.customExec || "—") : (item.execType || "—");
    const img = src => src ? `<img src="${src}" style="max-width:100%;max-height:${PHOTO_CELL_H - 14}px;object-fit:contain;display:inline-block;vertical-align:middle">` : "";
    return `
    <table style="width:100%;border-collapse:collapse;table-layout:fixed;${gapTop ? `margin-top:${gapTop}px;` : ""}">
      <colgroup><col style="width:80px"><col><col style="width:80px"><col></colgroup>
      <tbody>
        <tr>
          <td ${tdL}>施工位置</td><td ${tdV}>${item.location || "—"}</td>
          <td ${tdL}>燈具型號</td><td ${tdV}>${item.lightModel || "—"}</td>
        </tr>
        <tr><td ${tdL}>施工內容</td><td ${tdV} colspan="3">${execStr}</td></tr>
        <tr>
          <td colspan="2" style="border:1px solid #CBD5E0;padding:6px;height:${PHOTO_CELL_H}px;vertical-align:middle;text-align:center">${img(item.photos[0])}</td>
          <td colspan="2" style="border:1px solid #CBD5E0;padding:6px;height:${PHOTO_CELL_H}px;vertical-align:middle;text-align:center">${img(item.photos[1])}</td>
        </tr>
      </tbody>
    </table>`;
  };

  const groups = d.items || [];
  const pagesArr = [];
  let sigPlaced = false;
  const headerHTML = buildHeaderHTML(card);

  let p1 = headerHTML + infoHTML + secBar("施工與拍照記錄") + groupTableHTML(groups[0], 0);
  if (groups.length === 1) { p1 += buildSigHTML(); sigPlaced = true; }
  pagesArr.push({ html: p1, first: true });

  const rest = groups.slice(1);
  for (let i = 0; i < rest.length; i += 2) {
    const chunk = rest.slice(i, i + 2);
    let html = chunk.map((it, j) => groupTableHTML(it, j === 0 ? 0 : 8)).join("");
    const isLastChunk = i + 2 >= rest.length;
    if (isLastChunk && chunk.length === 1) { html += buildSigHTML(); sigPlaced = true; }
    pagesArr.push({ html, first: false });
  }
  if (!sigPlaced) pagesArr.push({ html: buildSigHTML(), first: false });

  return `<div>` + pagesArr.map((p, i) => {
    const last = i === pagesArr.length - 1;
    return pdfPageShell(p.html + (last ? buildFootHTML() : ""), p.first, last);
  }).join("") + `</div>`;
}

    + `<table style="width:100%;border-collapse:collapse;margin-bottom:14px"><tbody>${mainInfoRows}</tbody></table>`

function buildCustomInspectPDF(card, d) {

/* ── 照明設備檢測紀錄表 PDF ── */
function buildLightInspectPDF(card, d) {
  const tdL = `style="font-weight:700;background:#F8F9FA;font-size:11px;color:#374151;width:100px;padding:8px 9px;border:1px solid #CBD5E0;vertical-align:middle"`;
  const tdV = `style="font-size:12px;color:#1F2937;padding:8px 9px;border:1px solid #CBD5E0;vertical-align:middle"`;

  const basicHTML = secBar("專案設備測試使用紀錄") + `
    <table style="width:100%;border-collapse:collapse;margin-bottom:10px"><tbody>
      <tr><td ${tdL}>案名</td><td ${tdV}>${d.caseName || "—"}</td><td ${tdL}>燈具符號</td><td ${tdV}>${d.lightSymbol || "—"}</td></tr>
      <tr><td ${tdL}>安裝位置</td><td ${tdV}>${d.location || "—"}</td><td ${tdL}>測試日期</td><td ${tdV}>${d.testDate || "—"}</td></tr>
      <tr><td ${tdL}>測試人員</td><td ${tdV}>${d.tester || "—"}</td><td ${tdL}>記錄人員</td><td ${tdV}>${d.recorder || "—"}</td></tr>
      <tr><td ${tdL}>測試目的</td><td ${tdV} colspan="3">${d.testPurpose || "—"}</td></tr>
      <tr><td ${tdL}>參與人員</td><td ${tdV} colspan="3">${d.participants || "—"}</td></tr>
    </tbody></table>`;

  const specHTML = secBar("照明設備規格") + `
    <table style="width:100%;border-collapse:collapse;margin-bottom:10px"><tbody>
      <tr><td ${tdL}>廠牌</td><td ${tdV}>${d.brand || "—"}</td><td ${tdL}>燈具型號</td><td ${tdV}>${d.modelNo || "—"}</td></tr>
      <tr><td ${tdL}>型錄位置</td><td ${tdV}>${d.catalogLoc || "—"}</td><td ${tdL}>燈具形式</td><td ${tdV}>${d.lightForm || "—"}</td></tr>
      <tr><td ${tdL}>光源形式</td><td ${tdV}>${d.sourceForm || "—"}</td><td ${tdL}>光源批號</td><td ${tdV}>${d.sourceBatch || "—"}</td></tr>
      <tr><td ${tdL}>燈具材質</td><td ${tdV}>${d.lightMaterial || "—"}</td><td ${tdL}>W數</td><td ${tdV}>${d.wattage || "—"}</td></tr>
      <tr><td ${tdL}>光通量</td><td ${tdV}>${d.luminousFlux || "—"}</td><td ${tdL}>中心光強度</td><td ${tdV}>${d.centerIntensity || "—"}</td></tr>
      <tr><td ${tdL}>開孔尺寸</td><td ${tdV}>${d.apertureSize || "—"}</td><td ${tdL}>色溫度</td><td ${tdV}>${d.colorTemp || "—"}</td></tr>
      <tr><td ${tdL}>演色性 CRI≧</td><td ${tdV}>${d.cri || "—"}</td><td ${tdL}>CRI≧R9</td><td ${tdV}>${d.cri_r9 || "—"}</td></tr>
      <tr><td ${tdL}>防護等級 IP</td><td ${tdV}>${d.protectionLevel || "—"}</td><td ${tdL}>控制方式</td><td ${tdV}>${d.controlMethod || "—"}</td></tr>
      <tr><td ${tdL}>輸入電壓</td><td ${tdV} colspan="3">${d.inputVoltage || "—"}</td></tr>
      <tr><td ${tdL}>IES資訊</td><td ${tdV} colspan="3">${d.iesInfo || "—"}</td></tr>
    </tbody></table>`;

  const s1 = sumScore(d.opticalCheck);
  const page1 = buildHeaderHTML(card) + basicHTML + specHTML
    + secBar("測試照片") + photoGridHTML((d.testPhotos || []).map((p, i) => ({ src: p, label: `測試照片 ${i + 1}` })))
    + secBar("燈具光學品質評估表") + checklistTableHTML(OPTICAL_ITEMS, d.opticalCheck)
    + `<div style="text-align:right;font-size:12px;font-weight:700;color:#9A3412;background:#FFF7ED;border:1px solid #FED7AA;padding:8px 10px;margin-bottom:14px">評分：${s1}／30　審查結果：${gradeLabel(s1, OPTICAL_RANGES)}</div>`
    + secBar("審查意見") + `<div style="border:1px solid #CBD5E0;padding:10px;min-height:50px;font-size:12px;white-space:pre-wrap">${d.reviewComment1 || "—"}</div>`;

  const s2 = sumScore(d.qualityCheck);
  const page2 = secBar("光譜儀檢測紀錄照片") + photoGridHTML((d.spectroPhotos || []).map((p, i) => ({ src: p, label: `檢測照片 ${i + 1}` })))
    + secBar("原廠型錄尺寸圖") + photoGridHTML([{ src: d.catalogDrawing, label:"型錄尺寸圖" }])
    + secBar("燈具品質評估表") + checklistTableHTML(QUALITY_ITEMS, d.qualityCheck)
    + `<div style="text-align:right;font-size:12px;font-weight:700;color:#9A3412;background:#FFF7ED;border:1px solid #FED7AA;padding:8px 10px;margin-bottom:14px">評分：${s2}／36　審查結果：${gradeLabel(s2, QUALITY_RANGES)}</div>`
    + secBar("審查意見") + `<div style="border:1px solid #CBD5E0;padding:10px;min-height:50px;font-size:12px;white-space:pre-wrap">${d.reviewComment2 || "—"}</div>`;

  const bodyLabels = [["top","俯視圖"],["side","側視圖"],["bottom","下視圖"],["wireOutlet","燈體出線位置"],["base","固定腳座"],["adjustJoint","燈具調整關節處"],["powerConnector","電源接線頭"]];
  const page3 = secBar("燈具實體照片") + photoGridHTML(bodyLabels.map(([key, label]) => ({ src: (d.bodyPhotos || {})[key], label })))
    + secBar("燈具配件照片") + photoGridHTML((d.accessoryPhotos || []).map((p, i) => ({ src: p, label: `配件照片 ${i + 1}` })))
    + buildSigHTML() + buildFootHTML();

  return `<div>` + pdfPageShell(page1, true, false) + pdfPageShell(page2, false, false) + pdfPageShell(page3, false, true) + `</div>`;
}

/* ── 通用表單 PDF ── */
function buildGenericPDF(card, d) {
  const cfg = card.config;
  const notesHTML = secBar(cfg.notesLabel || "備註") + `<div style="border:1px solid #CBD5E0;padding:10px;min-height:50px;font-size:12px;white-space:pre-wrap;margin-bottom:14px">${d.note || "—"}</div>`;

  let photoHTML = "";
  if (cfg.hasPhoto) {
    const pPrint = d.photo ? `<img src="${d.photo}" crossorigin="anonymous" style="max-width:100%;max-height:130px;object-fit:contain;display:inline-block;vertical-align:middle">` : "";
    photoHTML = secBar(cfg.photoLabel || "相關照片") + `
      <table style="width:100%;border-collapse:collapse;margin-bottom:14px"><tbody>
        <tr><td style="border:1px solid #CBD5E0;padding:10px;width:50%;height:155px;vertical-align:middle;text-align:center">${pPrint}</td>
        <td style="border:1px solid #CBD5E0;padding:10px;width:50%;height:155px"></td></tr>
      </tbody></table>`;
  }

  let fieldsAfterHTML = "";
  if (cfg.fieldsAfter && cfg.fieldsAfter.length) {
    fieldsAfterHTML = fieldsTableHTML(cfg.fieldsAfter, d);
  }

  const inner = buildHeaderHTML(card)
    + secBar(`${card.label}資訊`) + fieldsTableHTML(cfg.fields || [], d)
    + itemsTableHTML(cfg.items, d.items)
    + fieldsAfterHTML
    + notesHTML
    + photoHTML
    + buildSigHTML(cfg.sigCols)
    + buildFootHTML();

  return `<div>` + pdfPageShell(inner, true, true) + `</div>`;
}

/* ── 設計部會議記錄 PDF（對外版：版面規格比照「工程回報」A4 不可出框標準） ── */

      <div style="font-size:22px;font-weight:800;color:#1F2937;letter-spacing:3px">${card.label}</div>

function buildDesignMeetingPDF(card, d) {
  const tdL = `style="font-weight:700;background:#F8F9FA;font-size:11px;color:#374151;width:90px;padding:8px 9px;border:1px solid #CBD5E0;vertical-align:middle;white-space:nowrap"`;
  const tdV = `style="font-size:12px;color:#1F2937;padding:8px 9px;border:1px solid #CBD5E0;vertical-align:middle"`;
  const boxStyle = "border:1px solid #CBD5E0;padding:10px;min-height:90px;font-size:12px;white-space:pre-wrap;margin-bottom:14px";

  const timeRange = (d.meetingStartH || d.meetingEndH)
    ? `${d.meetingStartH || "--"}:${d.meetingStartM || "00"} ～ ${d.meetingEndH || "--"}:${d.meetingEndM || "00"}`
    : "";
  const dateTimeStr = [d.meetingDate || "—", timeRange].filter(Boolean).join("　");

  const infoHTML = `
    <table style="width:100%;border-collapse:collapse;margin-bottom:14px">
      <tbody>
        <tr><td ${tdL}>會議時間</td><td ${tdV}>${dateTimeStr}</td><td ${tdL}>會議地點</td><td ${tdV}>${d.location || "—"}</td></tr>
        <tr><td ${tdL}>與會人員</td><td ${tdV}>${d.attendees || "—"}</td><td ${tdL}>記錄人員</td><td ${tdV}>${d.recorder || "—"}</td></tr>
        <tr><td ${tdL}>項目名稱</td><td ${tdV}>${d.projectName || "—"}</td><td ${tdL}>項目進程</td><td ${tdV}>${d.progress || "—"}</td></tr>
        <tr><td ${tdL}>會議主旨</td><td ${tdV} colspan="3">${d.topic || "—"}</td></tr>
      </tbody>
    </table>`;

  const contentHTML = secBar("會議內容") + `<div style="${boxStyle}">${d.content || "—"}</div>`;
  const postActionHTML = secBar("會議後執行內容") + `<div style="${boxStyle}">${d.postActions || "—"}</div>`;

  const sigLabelHTML = `<div style="font-weight:400;font-size:12px;background:#F3F4F6;padding:7px 10px;border:1px solid #CBD5E0;border-bottom:none;letter-spacing:1px;margin-top:14px">請於此頁簽署並惠于意見回覆，以利後續工作進行，謝謝。</div>`;
  const sigHTML = sigLabelHTML
    + `<div style="border:1px solid #CBD5E0;min-height:240px;margin-bottom:14px"></div>`;

  const inner = buildDesignMeetingHeaderHTML(card)
    + infoHTML
    + contentHTML
    + postActionHTML
    + sigHTML;

  return `<div>` + pdfPageShell(inner, true, true) + `</div>`;
}

function buildPDFHTML(card, d) {
  if (card.formKind === "survey") return buildSurveyPDF(card, d);
  if (card.formKind === "meeting" || card.formKind === "install") return buildSimplePDF(card, d);
  if (card.formKind === "design_meeting") return buildDesignMeetingPDF(card, d);
  if (card.formKind === "customInspect") return buildCustomInspectPDF(card, d);
  if (card.formKind === "lightInspect") return buildLightInspectPDF(card, d);
  if (card.formKind === "generic") return buildGenericPDF(card, d);
  return `<div>${pdfPageShell("<div>無法產生此表單的 PDF</div>", true, true)}</div>`;
}

/* ─── PDF Download Page ─── */
function PDFPage({ card, data, onBack }) {
  const [loading, setLoading] = useState(false);
  const [done,    setDone]    = useState(false);
  const fileName = `${card.label}_${DATE_FILE}.pdf`;
  const summaryRows = getSummaryRows(card, data);

  const handleDownload = async () => {
    setLoading(true);
    setDone(false);
    const pdfArea = document.getElementById("pdf-area");
    const prevScrollX = window.scrollX, prevScrollY = window.scrollY;
    try {
      pdfArea.innerHTML = buildPDFHTML(card, data);
      pdfArea.style.display = "block";
      pdfArea.style.position = "absolute";
      pdfArea.style.left = "0";
      pdfArea.style.top = "0";
      pdfArea.style.width = PAGE_W + "px";
      window.scrollTo(0, 0);

      const pdf = new window.jspdf.jsPDF({
        unit: "px",
        format: [PAGE_W, PAGE_H],
        orientation: "portrait",
        hotfixes: ["px_scaling"]
      });
      const pageEls = pdfArea.querySelectorAll(".pdf-page");
      for (let i = 0; i < pageEls.length; i++) {
        const canvas = await html2canvas(pageEls[i], {
          scale: 3,
          useCORS: true,
          allowTaint: true,
          logging: false,
          backgroundColor: "#ffffff",
          width: PAGE_W,
          height: PAGE_H,
          windowWidth: PAGE_W,
          windowHeight: PAGE_H,
          scrollX: 0,
          scrollY: 0
        });
        if (i > 0) pdf.addPage([PAGE_W, PAGE_H], "portrait");
        pdf.addImage(canvas.toDataURL("image/jpeg", 1.0), "JPEG", 0, 0, PAGE_W, PAGE_H);
      }
      pdf.save(fileName);
      setDone(true);
    } catch(err) {
      console.error(err);
      alert("PDF 產生失敗，請確認網路連線正常後重試。\n錯誤：" + err.message);
    } finally {
      pdfArea.style.display = "none";
      window.scrollTo(prevScrollX, prevScrollY);
      setLoading(false);
    }
  };

  return e("div", { style: { minHeight: "100vh", background: "#F1F5F9", paddingBottom: 90 } },
    e("div", { style: { background: "#1F2937", padding: "14px 18px", display: "flex", alignItems: "center", justifyContent: "space-between", position: "sticky", top: 0, zIndex: 10, boxShadow: "0 2px 8px rgba(0,0,0,0.3)" } },
      e("button", { onClick: onBack, style: { background: "none", border: "none", color: "#fff", fontSize: 14, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", gap: 6 } }, "← 返回表單"),
      e("span", { style: { color: "#F97316", fontWeight: 700, fontSize: 14 } }, "📄 預覽 & 下載")
    ),
    e("div", { style: { padding: "16px 14px" } },
      e("div", { style: { background: "#FFF7ED", border: "1.5px solid #FED7AA", borderRadius: 10, padding: "12px 14px", marginBottom: 16, fontSize: 13, color: "#92400E", lineHeight: 1.7 } },
        e("strong", null, "✅ 請確認表格資料無誤"), "，再點擊底部按鈕下載 PDF。", e("br"),
        e("span", { style: { fontSize: 11, color: "#B45309" } }, `📁 檔案名稱：${fileName}`)
      ),
      e("div", { style: { background: "#fff", borderRadius: 10, padding: "24px 18px", boxShadow: "0 4px 20px rgba(0,0,0,0.1)", fontFamily: "Arial,'Microsoft JhengHei',sans-serif", fontSize: 12, lineHeight: 1.5, overflow: "hidden" } },
        e("div", { style: { textAlign: "center", fontSize: 16, fontWeight: 800, color: "#1F2937", paddingBottom: 8, borderBottom: "2.5px solid #1F2937", marginBottom: 6, letterSpacing: 2 } }, `表單回報系統 — ${card.label}`),
        e("div", { style: { display: "flex", justifyContent: "space-between", fontSize: 10, color: "#6B7280", paddingBottom: 10, borderBottom: "1px solid #9CA3AF", marginBottom: 14 } },
          e("span", null, `填報日期：${DATE_STR}`),
          e("span", null, "系統版本：v1.0")
        ),
        e("table", { style: { width: "100%", borderCollapse: "collapse" } },
          e("tbody", null,
            summaryRows.map((row, i) => e("tr", { key: i },
              e("td", { style: { border:"1px solid #CBD5E0", padding:"7px 9px", fontWeight:700, background:"#F8F9FA", fontSize:11, color:"#374151", width:110, verticalAlign:"top" } }, row[0]),
              e("td", { style: { border:"1px solid #CBD5E0", padding:"7px 9px", fontSize:12, whiteSpace:"pre-wrap" } }, row[1])
            ))
          )
        )
      )
    ),
    e("div", { style: { position: "fixed", bottom: 0, left: 0, right: 0, background: "#fff", borderTop: "2px solid #E5E7EB", padding: "12px 16px", display: "flex", gap: 10 } },
      e("button", { onClick: onBack, style: { flex: 1, padding: "13px", fontSize: 14, fontWeight: 600, borderRadius: 12, border: "2px solid #E5E7EB", background: "#F9FAFB", cursor: "pointer", color: "#374151" } }, "← 返回修改"),
      e("button", {
        onClick: handleDownload,
        disabled: loading,
        style: {
          flex: 2, padding: "13px", fontSize: 15, fontWeight: 700, borderRadius: 12, border: "none",
          background: done ? "#059669" : loading ? "#9CA3AF" : "#F97316",
          color: "#fff", cursor: loading ? "not-allowed" : "pointer",
          display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
          boxShadow: loading || done ? "none" : "0 4px 12px rgba(249,115,22,.4)",
          transition: "background 0.3s"
        }
      }, loading ? "⏳ 產生中..." : done ? "✓ 下載完成！" : "⬇️ 確認下載 PDF")
    )
  );
}

/* ─── Main App ─── */
function App() {
  const [page, setPage] = useState("dashboard"); // dashboard | deptForms | form | preview
  const [deptId, setDeptId] = useState(null);
  const [cardId, setCardId] = useState(null);
  const [caseData, setCaseData] = useState(null);
  const [caseDataError, setCaseDataError] = useState(false);
  const [formData, setFormData] = useState({});

  useEffect(() => {
    fetch("data-sample.json")
      .then(res => { if (!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
      .then(json => setCaseData(json))
      .catch(err => { console.error("案件資料載入失敗:", err); setCaseDataError(true); });
  }, []);

  const card = CARDS.find(c => c.id === cardId);
  const dept = DEPARTMENTS.find(x => x.id === deptId);

  const getData = (id) => formData[id] || defaultDataFor(CARDS.find(c => c.id === id));
  const setData = (id, updater) => {
    setFormData(prev => {
      const cur = prev[id] || defaultDataFor(CARDS.find(c => c.id === id));
      const next = typeof updater === "function" ? updater(cur) : updater;
      return { ...prev, [id]: next };
    });
  };

  if (page === "preview" && card) {
    return e(PDFPage, { card, data: getData(cardId), onBack: () => setPage("form") });
  }

  if (page === "form" && card && card.formKind === "survey" && !caseData) {
    return e("div", { style: { minHeight: "100vh", background: "#F1F5F9", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 } },
      e("div", { style: { textAlign: "center", color: "#6B7280", fontSize: 14, lineHeight: 1.7 } },
        caseDataError
          ? "⚠️ 案件資料載入失敗，請確認 data-sample.json 是否與 index.html 放在同一層目錄，並透過網頁伺服器（而非直接雙擊開啟檔案）瀏覽本頁面。"
          : "載入案件資料中..."
      )
    );
  }

  if (page === "form" && card) {
    return e("div", { style: { minHeight: "100vh", background: "#F1F5F9", paddingBottom: 90 } },
      e("div", { style: { background: "#1F2937", padding: "14px 18px", display: "flex", alignItems: "center", gap: 14, position: "sticky", top: 0, zIndex: 10, boxShadow: "0 2px 8px rgba(0,0,0,0.3)" } },
        e("button", { onClick: () => setPage("deptForms"), style: { background: "none", border: "none", color: "#fff", fontSize: 14, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", gap: 6 } }, "← 返回"),
        e("div", { style: { width: 1, height: 22, background: "rgba(255,255,255,0.2)" } }),
        e("div", { style: { width: 34, height: 34, borderRadius: 9, background: card.bg, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16 } }, card.icon),
        e("span", { style: { color: "#fff", fontWeight: 700, fontSize: 16 } }, card.label)
      ),
      e("div", { style: { padding: "16px 14px" } },
        e("div", { style: S.card },
          renderFormBody(card, getData(cardId), upd => setData(cardId, upd), caseData)
        )
      ),
      e("div", { style: { position: "fixed", bottom: 0, left: 0, right: 0, background: "#fff", borderTop: "2px solid #E5E7EB", padding: "12px 16px" } },
        e("button", {
          onClick: () => setPage("preview"),
          style: { width: "100%", padding: "15px", fontSize: 16, fontWeight: 700, borderRadius: 12, border: "none", background: "linear-gradient(135deg,#F97316 0%,#EA580C 100%)", color: "#fff", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 9, boxShadow: "0 4px 12px rgba(249,115,22,0.4)" }
        }, "📄 儲存並產生 PDF")

    return e("div", { style: { minHeight: "100vh", background: "#111827" } },
      e("div", { style: { background: "#1F2937", padding: "20px 18px", display: "flex", alignItems: "center", gap: 14, borderBottom: "1px solid rgba(255,255,255,0.05)" } },
        e("button", { onClick: () => setPage("dashboard"), style: { background: "none", border: "none", color: "#fff", fontSize: 14, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", gap: 6 } }, "← 返回"),

              onMouseLeave: ev => { ev.currentTarget.style.borderColor = "rgba(255,255,255,0.08)"; ev.currentTarget.style.background = "#1F2937"; }
            },
              e("div", { style: { width: 52, height: 52, borderRadius: 12, background: c.bg, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 24, flexShrink: 0 } }, c.icon),
              e("div", { style: { flex: 1 } },
                e("div", { style: { color: "#F9FAFB", fontSize: 17, fontWeight: 700, marginBottom: 3 } }, c.label),
                e("div", { style: { color: "#9CA3AF", fontSize: 12, lineHeight: 1.4 } }, c.desc)
              ),
              e("span", { style: { color: c.color, fontSize: 22 } }, "›")
            )
          )
        )
      )
    );
  }

  /* Dashboard：部門選擇 */
  return e("div", { style: { minHeight: "100vh", background: "#111827" } },
    e("div", { style: { background: "#1F2937", padding: "30px 18px 22px", borderBottom: "1px solid rgba(255,255,255,0.05)" } },
      e("div", { style: { display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 20 } },
        e("div", null,
          e("div", { style: { fontSize: 10, color: "#F97316", fontWeight: 700, letterSpacing: 3, marginBottom: 5 } }, "REPORTING SYSTEM"),
          e("h1", { style: { color: "#fff", fontSize: 26, fontWeight: 800, margin: 0, lineHeight: 1.2 } }, "表單回報系統")
        ),
        e("div", { style: { textAlign: "right" } },
          e("div", { style: { color: "#9CA3AF", fontSize: 11, marginBottom: 2 } }, "今日日期"),
          e("div", { style: { color: "#F9FAFB", fontSize: 14, fontWeight: 600 } }, DATE_STR)
        )
      ),
      e("div", { style: { display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 8, background: "rgba(255,255,255,0.05)", borderRadius: 10, padding: 12 } },
        [{ l: "進行案件", v: "4 件" }, { l: "本週回報", v: "12 份" }, { l: "待審核", v: "3 份" }].map(s =>
          e("div", { key: s.l, style: { textAlign: "center" } },
            e("div", { style: { color: "#F97316", fontSize: 20, fontWeight: 800 } }, s.v),
            e("div", { style: { color: "#9CA3AF", fontSize: 11 } }, s.l)
          )
        )
      )
    ),
    e("div", { style: { padding: "20px 14px" } },
      e("div", { style: { color: "#F3F4F6", fontSize: 14, fontWeight: 700, marginBottom: 12 } }, "🏢 選擇部門"),
      e("div", { style: { display: "flex", flexDirection: "column", gap: 12 } },
        DEPARTMENTS.map(d => {
          const count = CARDS.filter(c => c.dept === d.id).length;
          return e("button", {
            key: d.id,
            onClick: () => { setDeptId(d.id); setPage("deptForms"); },
            style: { background: "#1F2937", border: "1.5px solid rgba(255,255,255,0.08)", borderRadius: 14, padding: "18px", cursor: "pointer", display: "flex", alignItems: "center", gap: 14, width: "100%", textAlign: "left", transition: "border-color 0.15s, background 0.15s" },
            onMouseEnter: ev => { ev.currentTarget.style.borderColor = d.color; ev.currentTarget.style.background = "#243040"; },
            onMouseLeave: ev => { ev.currentTarget.style.borderColor = "rgba(255,255,255,0.08)"; ev.currentTarget.style.background = "#1F2937"; }
          },
            e("div", { style: { width: 56, height: 56, borderRadius: 14, background: d.bg, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 26, flexShrink: 0 } }, d.icon),
            e("div", { style: { flex: 1 } },
              e("div", { style: { color: "#F9FAFB", fontSize: 16, fontWeight: 800, marginBottom: 3 } }, d.label),
              e("div", { style: { color: "#9CA3AF", fontSize: 12 } }, `${count} 項表單`)
            ),
            e("span", { style: { color: d.color, fontSize: 22 } }, "›")
          );
        })
      ),
      e("div", { style: { marginTop: 20, background: "#1F2937", borderRadius: 12, padding: "14px 16px", border: "1px solid rgba(255,255,255,0.06)" } },
        e("div", { style: { color: "#9CA3AF", fontSize: 12, fontWeight: 700, marginBottom: 10 } }, "📅 最近回報"),
        [
          { t: "工程回報 — 元帥府",   time: "今天 09:30",  c: "#F97316" },
          { t: "工地會議 — 例行週會",  time: "昨天 14:00",  c: "#2563EB" },
          { t: "現場會勘 — B區",       time: "昨天 16:45",  c: "#059669" },
        ].map((r, i) =>
          e("div", { key: i, style: { display: "flex", alignItems: "center", gap: 10, padding: "8px 0", borderTop: i > 0 ? "1px solid rgba(255,255,255,0.05)" : "none" } },
            e("div", { style: { width: 7, height: 7, borderRadius: "50%", background: r.c, flexShrink: 0 } }),
            e("div", { style: { flex: 1, color: "#D1D5DB", fontSize: 12 } }, r.t),
            e("div", { style: { color: "#6B7280", fontSize: 11 } }, r.time)
          )
        )
      )
    )
  );
}

try {
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(e(App));
} catch(err) {
  console.error("React掛載失敗:", err);
  document.getElementById("root").innerHTML = "<div style='color:white;padding:20px;'>應用程式初始化失敗，請檢查網路 CDN 連線。</div>";
}
</script>
</body>
</html>
