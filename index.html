<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>現場作業數位平台</title>
<meta name="theme-color" content="#0F1512">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.svg">
<link rel="apple-touch-icon" href="icons/icon-192.svg">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif; }
  body { background: #0F1512; }
  #root { min-height: 100vh; }
  select, input, textarea, button { font-family: inherit; }
  select:focus, input:focus, textarea:focus { outline: 2px solid #F97316; outline-offset: 1px; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:active { transform: scale(0.98); }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #1F2937; }
  ::-webkit-scrollbar-thumb { background: #4B5563; border-radius: 4px; }
  #pdf-area { display: none; }
  @media print {
    body * { visibility: hidden; }
    #pdf-area, #pdf-area * { visibility: visible; }
    #pdf-area { display: block !important; position: fixed; top: 0; left: 0; width: 100%; }
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="pdf-area"></div>

<script src="js/data.js"></script>
<script src="js/db.js"></script>
<script src="js/widgets.js"></script>
<script src="js/forms.js"></script>
<script src="js/app.js"></script>
</body>
</html>
